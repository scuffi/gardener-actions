name: Check release artifacts

on:
  pull_request:
  push:
    branches: [main, release/v1.1.0-rc1]

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Action entrypoints and immutable digests
        run: |
          node --check actions/runner/dist/index.cjs
          node --check actions/effects/dist/index.cjs
          grep -Fq 'main: dist/index.cjs' actions/runner/action.yml
          grep -Fq 'main: dist/index.cjs' actions/effects/action.yml
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const provenance = JSON.parse(fs.readFileSync('PROVENANCE.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(provenance.sourceCommit)) throw new Error('Invalid source commit');
          for (const [path, expected] of Object.entries(provenance.artifacts)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
            if (actual !== expected) throw new Error(`${path} does not match PROVENANCE.json`);
          }
          NODE
