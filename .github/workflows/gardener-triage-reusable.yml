name: Gardener issue triage

on:
  workflow_call:
    inputs:
      harness-url:
        required: true
        type: string
      task-bundle-hash:
        required: true
        type: string

permissions: {}

jobs:
  plan:
    name: Triage issue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      effect-sha256: ${{ steps.gardener.outputs.effect-artifact-sha256 }}
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Triage with Gardener
        id: gardener
        uses: scuffi/gardener-actions/actions/runner@71ec3e643887d8952ab780da42f406e7b234f1bb
        with:
          harness-url: ${{ inputs.harness-url }}
          agent-hash: ${{ inputs.task-bundle-hash }}
      - name: Upload exact effect plan
        if: ${{ steps.gardener.outputs.effect-artifact-sha256 != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gardener-effect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gardener.outputs.effect-artifact-path }}
          if-no-files-found: error
          retention-days: 1

  effects:
    name: Post exact triage comment
    needs: plan
    if: ${{ needs.plan.outputs.effect-sha256 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: gardener-effects
    permissions:
      issues: write
      id-token: write
    steps:
      - name: Download exact effect plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gardener-effect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gardener-effect
      - name: Execute exact Gardener effect
        uses: scuffi/gardener-actions/actions/effects@71ec3e643887d8952ab780da42f406e7b234f1bb
        with:
          artifact-path: ${{ runner.temp }}/gardener-effect/${{ needs.plan.outputs.effect-sha256 }}.json
          expected-sha256: ${{ needs.plan.outputs.effect-sha256 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          harness-url: ${{ inputs.harness-url }}
